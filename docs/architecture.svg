<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif">
  <rect width="900" height="340" fill="#F7F9FA" rx="12"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-size="16" font-weight="600" fill="#16232B">Symptomatic — Prediction Pipeline</text>

  <!-- Step 1: Input -->
  <rect x="30" y="70" width="150" height="90" rx="10" fill="#FFFFFF" stroke="#E3E9EC" stroke-width="1.5"/>
  <text x="105" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#16232B">Symptom Input</text>
  <text x="105" y="124" text-anchor="middle" font-size="11" fill="#5B6B73">Picker + free text</text>
  <text x="105" y="140" text-anchor="middle" font-size="11" fill="#5B6B73">+ age/sex/duration</text>

  <path d="M180 115 L228 115" stroke="#0E7C7B" stroke-width="2" marker-end="url(#arrow1)"/>

  <!-- Step 2: Gemini parse -->
  <rect x="230" y="70" width="150" height="90" rx="10" fill="#E3F2F1" stroke="#0E7C7B" stroke-width="1.5"/>
  <text x="305" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#0A5E5D">Gemini</text>
  <text x="305" y="120" text-anchor="middle" font-size="11" fill="#0A5E5D">Free text →</text>
  <text x="305" y="135" text-anchor="middle" font-size="11" fill="#0A5E5D">symptom tags</text>

  <path d="M380 115 L428 115" stroke="#0E7C7B" stroke-width="2" marker-end="url(#arrow1)"/>

  <!-- Step 3: ML model -->
  <rect x="430" y="70" width="170" height="90" rx="10" fill="#FFFFFF" stroke="#16232B" stroke-width="1.5"/>
  <text x="515" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#16232B">RandomForest</text>
  <text x="515" y="117" text-anchor="middle" font-size="11" fill="#5B6B73">132 symptoms →</text>
  <text x="515" y="132" text-anchor="middle" font-size="11" fill="#5B6B73">41 disease probabilities</text>
  <text x="515" y="150" text-anchor="middle" font-size="10" fill="#0E7C7B" font-weight="600">97.6% test accuracy</text>

  <path d="M600 115 L648 115" stroke="#0E7C7B" stroke-width="2" marker-end="url(#arrow1)"/>

  <!-- Step 4: Gemini explain -->
  <rect x="650" y="70" width="190" height="90" rx="10" fill="#E3F2F1" stroke="#0E7C7B" stroke-width="1.5"/>
  <text x="745" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#0A5E5D">Gemini</text>
  <text x="745" y="117" text-anchor="middle" font-size="11" fill="#0A5E5D">Plain-language explanation</text>
  <text x="745" y="132" text-anchor="middle" font-size="11" fill="#0A5E5D">+ red-flag / emergency check</text>

  <!-- Down arrow to output -->
  <path d="M745 160 L745 200" stroke="#0E7C7B" stroke-width="2" marker-end="url(#arrow1)"/>
  <path d="M745 200 L305 200" stroke="#0E7C7B" stroke-width="2"/>
  <path d="M305 200 L305 228" stroke="#0E7C7B" stroke-width="2" marker-end="url(#arrow1)"/>

  <!-- Output -->
  <rect x="120" y="230" width="370" height="80" rx="10" fill="#FFFFFF" stroke="#C1443D" stroke-width="1.5"/>
  <text x="305" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="#16232B">Response</text>
  <text x="305" y="277" text-anchor="middle" font-size="11" fill="#5B6B73">Ranked diseases · confidence % · specialist type</text>
  <text x="305" y="293" text-anchor="middle" font-size="11" fill="#5B6B73">general care categories · emergency flag</text>

  <!-- Nearby specialists branch -->
  <rect x="530" y="230" width="330" height="80" rx="10" fill="#FFFFFF" stroke="#E3E9EC" stroke-width="1.5"/>
  <text x="695" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="#16232B">Google Places API</text>
  <text x="695" y="277" text-anchor="middle" font-size="11" fill="#5B6B73">Top specialist type → nearby</text>
  <text x="695" y="293" text-anchor="middle" font-size="11" fill="#5B6B73">real clinics/doctors</text>

  <path d="M490 270 L528 270" stroke="#5B6B73" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow2)"/>

  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0E7C7B"/>
    </marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5B6B73"/>
    </marker>
  </defs>
</svg>
